# cargo-mutants configuration (read automatically from the source tree).
#
# The worktree reaper's signalling path is excluded from mutation on purpose: a mutant that
# widens WHICH processes get signalled, or removes a guard (pid > 1, base strictly under
# .rigger/tmp, cwd re-check before each signal), is a mutant that kills processes it must not.
# Test binaries run inside a pid namespace (.cargo/pidns-runner.sh) so such a mutant could only
# ever reach the namespace, but a reaper is a loaded gun by definition and its mutation
# "survivors" would prove nothing about the guard's necessity - the guard is exercised by
# explicit tests instead (specs/78-no-os-level-kills.md, criterion 2).
# The spec-78 run proved the original `exclude_re` form here a latent no-op (decision
# u78c2r2-mutants-toml-exclude-re-latent-noop): cargo-mutants matches exclude_re against the
# mutant NAME string, "<file>:<line>:<col>: replace <fn> ...", which never contains a
# `reap::`-qualified path. Exclude the file itself instead - the whole module is the reaper.
exclude_globs = ["src/reap.rs"]

# Copy `.git` into the build directory cargo-mutants tests in (default: false). Without this,
# the baseline (unmutated) check fails outright before any mutant is tested:
# tests/validate_behind_the_tree_periphery.rs's real-binary tests shell out to
# `git rev-parse --git-common-dir` and need a real repository to find, which a VCS-less copy
# does not provide (decision impl-u62c3-copy-vcs-baseline-fix). This is a whole-suite
# precondition, not specific to any one unit's diff.
copy_vcs = true
