# Bound peak build memory. The default `symbols` feature compiles several bundled
# tree-sitter grammars (generated C sources); with the default one-rustc-per-core
# (32 on this box) a build can spike tens of GB at once and OOM a loaded workstation.
# Capping parallel codegen jobs keeps peak memory bounded while staying reasonably
# fast. Raise it if you have headroom; lower it (e.g. 4) if the machine is heavily loaded.
#
# NOTE: this is ADVISORY and workspace-wide - it also throttles the light
# `--no-default-features` (grep-only) lane, which compiles no grammars and could build
# faster at a higher job count. The cap is kept global for simplicity and because the
# default `symbols` lane is the memory-sensitive one; a caller who only builds the grep
# lane can override with `CARGO_BUILD_JOBS=<n>` (env wins over this file) for more parallelism.
[build]
jobs = 8

# Run every test binary inside a user+pid+mount namespace (blast-radius containment for the
# process reaping rigger's tests do). Rationale, fail-closed behavior and the opt-out for
# throwaway CI environments are documented in the runner script itself.
[target.x86_64-unknown-linux-gnu]
runner = ".cargo/pidns-runner.sh"
