# Rigger developing Rigger: the self-hosting producing loop, expressed as
# Rigger CONTENT.
#
# This is the canonical example of a Rigger project - and it produces Rigger
# itself. Rigger is a pure-Rust crate now, so every gate below is a real cargo
# invocation matching the repo's CI (.github/workflows/rust.yml). Run it from
# the repo root with `rigger run <spec>`. Validate it with `rigger validate`.
#
# The loop reinforces itself: every agent is grounded on only the code it needs,
# records each decision live to the shared event log (so the next stage and any
# concurrent agent see it), and must pass machine-verifiable gates. Failures
# escalate or are bounded-retried - never silently dropped.
#
# The review is PER UNIT, not a downstream stage. Each implementer unit runs its
# OWN lifecycle - ground -> implement (red/green TDD in a worktree) -> the unit's
# gates -> three-tier review OF THIS UNIT (lenses -> adversary -> adjudicator) ->
# integrate - and a reject or a gate failure feeds back into that same unit's
# remediation loop. `defaults.review` declares the panel once; every unit (the
# `implement` stage and every planner-proposed unit) inherits it.

defaults:
  autonomy: auto_notify     # manual | auto_notify | silent
  grounder: symbols         # symbols | grep | nop

  # The grep guard: every spawn's settings, and `rigger setup` in the operator's checkout, carry
  # the PreToolUse hook that denies a grep not marked literal, so an agent asks the graph lookup
  # first and a literal search is a deliberate, reported fallback.
  grep_guard: true

  # The unit size cap: the planner's protocol and every DAG critique round state that a unit
  # expected to add more than this many lines is too large, so each unit stays one reviewable
  # change.
  max_unit_added_lines: 3000

  # The agent that writes each unit's periphery tests at the build seam, after its implementer
  # is green and before the gates (.rigger/agents/sdet-author.md). Absent, no test author runs
  # and a unit's tests are only those its implementer wrote.
  test_author: sdet-author

  # The spawn-budget circuit-breaker (§4.4, §8): the hard cap on agent spawns a
  # single unattended run may make. When spawns reach it the breaker records
  # BudgetExhausted and aborts the run, so a runaway loop (e.g. a unit a reviewer
  # keeps rejecting) can never spawn unboundedly. NON-ZERO on purpose - 0 means
  # unlimited, which is what let a 5-hour churn run never trip. Raise it for a big
  # spec; never set it back to 0 for an unattended run.
  # 2026-07-02: raised 60 -> 200 for the spec-05 campaign run. The count folds
  # cumulatively from recorded SpawnRequested events (never resets per process), and
  # 60 was consumed by one 12-implementer fan-out wave plus reviews, remediation,
  # two zombie units (Gap 11), and several crashed-process retries. 200 bounds ten
  # units' full review lifecycles; still a hard cap, never 0.
  # 2026-07-03: raised 200 -> 400 for the spec-06 run. The unscoped stream (Gap 11)
  # already holds exactly 200 spawns, so a new run under 200 halts before its first
  # spawn. Spec 06 unit 1 scopes the fold per run, making this cumulative-count
  # artifact obsolete; revisit the number after it lands.
  budget: 400

  # The remediation depth (§4.4): how many attempts a failed unit gets before it
  # escalates to a human. This is the REFINEMENT-depth knob, NOT a review-rigor
  # knob - it gives a subtle unit room to CONVERGE under the full strict review
  # instead of escalating prematurely. Raise it when a unit's defects are genuine
  # but DIMINISHING across iterations (the lenses go clean, only the adversary's
  # deep findings remain) and the default 3 is too few to converge; it loosens the
  # depth limit, never the review bar. Absent falls back to 3 (the historical
  # default). Bounded by `budget` above, so it can never spin unboundedly.
  max_retries: 6

  # The per-spawn wall-clock bound in SECONDS (spec 10, unit 3): the liveness ceiling
  # every spawn inherits unless its agent's frontmatter sets its own `max_wall_clock`
  # (per-role override). The agent host stops a spawn whose agent stream stays silent
  # past this bound with no result and records the stop as an INFRASTRUCTURE fault on
  # the spawn's id, charging the unit NO remediation attempt (its code is not at fault),
  # so a hung agent halts the wave VISIBLY instead of stalling it invisibly. 0 (absent)
  # means unbounded - liveness timeouts are opt-in. 3600s (1h) is a deliberately generous
  # "definitely hung" ceiling for this repo's cargo-heavy workers; a fast reviewer role
  # can pin a tighter bound in its own frontmatter.
  max_wall_clock: 3600

  # How many implement units build at once (spec 89, per-unit pipelining). Each live unit
  # owns a debug build cache of about 50 GB on this crate, and a driver death makes every
  # live unit rebuild at once; five in parallel filled /home twice on 2026-09-15 (Steam
  # holds most of the disk). Two bounds the worst case to about 100 GB of caches.
  max_parallel_units: 2

  # The three-tier review panel applied to EVERY implementer unit (§3.2). TIER 1:
  # the expert lenses (architecture + sdet) review the unit's diff in parallel.
  # TIER 2: the adversary reviews THE LENSES' findings and tries to prove them
  # wrong - higher bar, surfaces what they all missed, refutes overreach (it
  # reviews the reviews; it is not a parallel lens). TIER 3: the adjudicator is the
  # neutral final judge - it weighs the lenses against the adversary, blocks only on
  # wrong code, an unmet Done-when criterion or a missing test for one (every other
  # finding a note), and its approve/reject verdict GATES the unit's integration. Declared once; inherited by the implement stage and
  # every planner-proposed unit.
  review:
    lenses: [architecture-reviewer, sdet]   # tier 1: the expert lenses
    adversary: adversary                    # tier 2: refutes the lenses
    adjudicator: adjudicator                # tier 3: neutral judge; verdict gates

  # The declarative failure taxonomy (spec 10, unit 2). An ORDERED, first-match-wins
  # list of rules that classify a failure signal (a process's `exit_status`, terminating
  # `signal`, and/or an `output_regex` over its captured output) into a `class` -
  # `infra` | `product` | `flaky` - with a per-rule rerun `limit` and exponential
  # `backoff` ({duration_ms, factor, max_ms}). It replaces the infra-vs-product split the
  # conductor hand-coded across its gate/spawn sites (R1). At an inline gate the class
  # drives the three-way outcome: a `product` failure fails immediately and demotes the
  # autonomy ratchet (today's behavior); a `flaky`/`infra` failure is rerun up to `limit`
  # and a MIXED result (it passed on a rerun) is a FlakyVerdict pass-with-warning that
  # NEVER demotes; a `flaky` that stays red demotes, an `infra` that stays red does not.
  #
  # OMITTED (as here) means the shipped code default (`failure::Taxonomy::default`) is
  # used, whose rules preserve spec-07 semantics: recognised transient infra faults
  # (out of disk, refused/reset connection, DNS failure) classify `infra` and reran;
  # everything else is `product` (no rerun). Uncomment to author your own, e.g.:
  #
  # failure_rules:
  #   - match: {output_regex: "SIGSEGV|thread panicked while panicking"}
  #     class: flaky
  #     limit: 2
  #     backoff: {duration_ms: 1000, factor: 2.0, max_ms: 30000}
  #   - match: {exit_status: 137}          # OOM-killed worker
  #     class: infra
  #     limit: 1
  #   - match: {}                          # catch-all: any other failure is a defect
  #     class: product

build:
  # spec 91 retires the per-round `mutation` switch entirely (an explicit value of any
  # kind is now a validation error naming this spec): no per-round sweep; the sweep is the
  # `mutation` gate below, declared but unwired until #32 lands.
  max_concurrent: 1         # serialize builds machine-wide: two concurrent cargo-mutants sweeps (~100G each) exhausted /home this session. Blunt cap (operator-binary boundary blocks a surgical mutation-only slot); revisit as a spec.

gates:                      # the project's verification library, referenced by name
  # fmt, clippy and build cover every workspace crate, never the root package alone: a bare
  # `cargo clippy` or `cargo build` here reaches only the root package, so no crate's own code
  # would be linted or built under any unit (a bare `cargo fmt --check` already walked every
  # member; `--all` says so). `clippy` lints the default features; `clippy-no-default` lints the
  # same targets without them, the no-default lane's own lint command (.rigger/gates/lanes.sh), so
  # a change that stops that lane compiling fails at its unit (the lane gates below say why).
  fmt:    { run: "cargo fmt --all --check",                              kind: core }
  clippy: { run: "cargo clippy --workspace --all-targets -- -D warnings", kind: core }
  clippy-no-default:
    run: "cargo clippy --workspace --all-targets --no-default-features -- -D warnings"
    kind: core
  build:  { run: "cargo build --workspace",                              kind: core }
  # The test gate runs every workspace crate's tests, with the container runtime snippet
  # (.rigger/gates/container-env.sh) sourced first so the container-backed tests run instead of
  # skipping. The logic lives in `.rigger/gates/test.sh` (its header carries the why of each
  # clause); `tests/principle_gates_wiring.rs` drives it on fixture worktrees.
  test:
    run: "sh .rigger/gates/test.sh"
    kind: core
  # The lane gates: the no-default and core feature lanes, each through the one script CI runs
  # (.rigger/gates/lanes.sh), so a check-in never lands a tree CI then fails on a lane the gates
  # above never built. The script derives the core lane's members from the workspace and fails a
  # test step that ran no test. Every implement round gates the core lane in full and the
  # no-default lane's lint (`clippy-no-default` above), so a change that breaks either lane's
  # build surfaces at the unit that made it. The no-default lane's tests run once, at the
  # check-in, on the merged tree: they are the default lane's suite again under fewer features,
  # so a unit whose no-default lint is green rarely fails them, and the check-in still stops that
  # failure before the spec lands, for one suite run a spec instead of one per unit battery. These
  # gates are where each lane is proven, so no reviewer runs a lane by hand. Each sources the
  # container runtime snippet first, as `test` does, so container-backed tests run, not skip.
  lane-no-default:
    run: ". .rigger/gates/container-env.sh || exit 1; sh .rigger/gates/lanes.sh no-default"
    kind: core
  lane-core:
    run: ". .rigger/gates/container-env.sh || exit 1; sh .rigger/gates/lanes.sh core"
    kind: core
  # The content gates: checks over the lines a diff adds - `style` (Gap 4a: no em dash, U+2014,
  # in any added text) and `no-os-kill` (spec 78: no OS-level kill, process-group target or
  # direct signal call in code outside the two sanctioned lifecycle helpers). The checks, and the
  # why of each, live in `.rigger/gates/content.sh`. A unit's gates check the unit's own diff,
  # three-dot from the run branch, so a unit is never failed by a change it did not make; the
  # check-in stage's `-spec` gates check the whole spec diff, from `$RIGGER_RUN_BASE` (the run
  # branch's tip when the run started, which the conductor exports to every gate), so operator
  # commits that landed on the run branch directly are checked too, never only the check-in
  # branch's own commits. `tests/cli.rs` drives both forms on a fixture repository.
  #
  # The unit forms (`style`, `no-os-kill`) read only the unit's own diff, which is empty once the
  # unit has landed, so each declares `post_merge: false`: the post-merge re-gate would check
  # nothing. The `-spec` forms stay in the post-merge re-gate: they read the whole spec diff from
  # the run base, so after landing they are the one check of content a merge resolution introduced.
  style:           { run: "sh .rigger/gates/content.sh style",                         kind: core, post_merge: false }
  no-os-kill:      { run: "sh .rigger/gates/content.sh no-os-kill",                    kind: core, post_merge: false }
  style-spec:      { run: 'sh .rigger/gates/content.sh style "$RIGGER_RUN_BASE"',      kind: core }
  no-os-kill-spec: { run: 'sh .rigger/gates/content.sh no-os-kill "$RIGGER_RUN_BASE"', kind: core }
  # The boundary gate (workspace split, step 0): Clean Architecture made mechanical.
  # `tests/boundary_audit.rs` fails when a workspace crate depends outward (the ring table in
  # the test), when production code constructs an adapter (a store, a graph, an agent driver)
  # outside the composition root, or when an item exempts itself from a denied principle
  # lint. Each rule's allowlist of today's offenders only shrinks. The adjudicator treats a red boundary gate as non-negotiable.
  boundary: { run: "cargo test --test boundary_audit", kind: core }
  # The red-before-green gate (workspace split, step 0): TDD made mechanical. The unit
  # branch's first commit that touches source - any path with a `src/` component (`src/...`,
  # `crates/<name>/src/...`, `tools/<name>/src/...`) - must be preceded by, or
  # itself carry, a test change (a `tests` file, an added `#[test]` item, or a hunk reaching the
  # file's test module - from the first column-0 `#[cfg(test)]` that opens a `mod` body to the
  # end of the file). The logic lives in
  # `.rigger/gates/red-before-green.sh`; `tests/principle_gates_wiring.rs` drives it on
  # fixture repositories. The reviewer lens checks the same order. It reads the unit's commits
  # since their merge base with the run branch, which is empty once the unit has landed, so it
  # declares `post_merge: false`.
  red-before-green: { run: "sh .rigger/gates/red-before-green.sh", kind: core, post_merge: false }
  # The check-in-stage mutation gate (spec 91): the diff-scoped `cargo mutants` sweep, run
  # ONCE by a `checkin` stage that lists it - after every implement unit has integrated - never
  # per implementer round. The `checkin` stage below leaves it unwired until #32 lands. The
  # logic lives in `.rigger/gates/mutation.sh` (its header carries the
  # why of every clause: the `$RIGGER_RUN_BASE` diff base, the whole-workspace mutation with
  # diff-scoped test packages, the sweep's own memory-bounded scope and `-j` sizing, the
  # incremental anchor, the instrument-narrowing refusal and the survivor lines);
  # `tests/checkin_mutation_diff_base_periphery.rs` drives it on fixture repositories, and
  # `rigger init` writes the same script into a consumer project. rigger knows no gate by id: a
  # gate names the executables it needs under its own `requires` key, and every validating load
  # of this workflow (`rigger validate` among them) refuses a declared gate whose `requires`
  # names an executable not on PATH. This gate declares no `requires` while it stays unwired;
  # #32 adds `requires: [cargo-mutants, cargo-nextest]` when it re-wires it.
  mutation: { run: "sh .rigger/gates/mutation.sh", kind: core }
  # The self-evaluation gate: the format check over the newest run file under docs/evaluation/.
  # The logic, and the why of every rule, live in `.rigger/gates/evaluate.sh`; the procedure is
  # docs/evaluation/README.md. It is declared and wired to no stage: the operator runs the
  # evaluation after a landing and before the next run, so it can never block or undo a landing.
  evaluate: { run: "sh .rigger/gates/evaluate.sh check", kind: core }

stages:
  # 1. Refine the spec's decomposition. The conductor itself creates one baseline
  #    implement unit per acceptance criterion (the deterministic decomposition);
  #    the planner REFINES that baseline - splitting a criterion into several units,
  #    or adding a necessary sub-unit / dependency - via UnitProposed. A produces
  #    stage decomposes the whole spec, so it has no single coverage criterion: it
  #    grounds on the spec's acceptance criteria, not on a `coverage` label.
  plan:
    agent: planner
    produces: dag           # refine the spec's unit DAG at runtime

  # 1b. Adversarial plan-critique gate (spec 10, Unit 1). Before ANY implementer
  #    spawns, the existing adversary + adjudicator review the PROPOSED unit DAG the
  #    planner produced. The gate judges the decomposition for the two cross-unit hazards
  #    a per-unit review cannot see: ambiguous mitigation OWNERSHIP (rule 7 - one demanded
  #    fix owned by two units with no exclusion named) and open DISPOSITIONS (rule 8 - a
  #    criterion a reviewer can re-litigate). A shared blast radius is NOT one of them: it
  #    is surfaced as INFORMATIONAL context only, because `partition: by-blast-radius`
  #    never runs two overlapping units at the same time and worktree
  #    isolation keeps every reviewer on its own diff, so overlap integrates cleanly (see
  #    handbook rule 6). A reject feeds back to the planner (bounded by max_retries); only
  #    an approve RELEASES the fan-out. It is review-only (no `agent`) - it critiques the
  #    plan, it does not implement - and it needs `plan`, so the conductor runs it between
  #    planning and the fan-out. The informational blast-radius context excludes
  #    already-integrated and terminal units (`dag_unit_blast_radii`), so a settled unit
  #    is never presented as a live overlap the planner cannot resolve. Owns: pre-fan-out
  #    decomposition review. Per-unit review is untouched.
  plan-critique:
    needs: [plan]
    adversary: adversary        # tier 2: reviews the DAG and refutes it
    adjudicator: adjudicator    # tier 3: its approve/reject gates the fan-out

  # 2. Implement, review, and integrate PER UNIT. One Rust implementer per ready
  #    unit, each in an isolated worktree, partitioned by blast-radius so the waves
  #    stay disjoint. Each unit's complete lifecycle runs inside this one stage:
  #    red -> green is enforced around the change, the full gate set
  #    (fmt + clippy with and without the default features + build + test + the core lane +
  #    style) must pass, THEN
  #    the unit reviews ITSELF through `defaults.review`'s three tiers, and only on adjudicator-approve + green gates
  #    does it integrate (on_pass: merge). A reject or a gate failure feeds back into
  #    this same unit's remediation loop (re-ground, re-implement with the feedback)
  #    and escalates after the retry bound - it does NOT integrate. Every
  #    planner-proposed unit inherits the same per-unit review via defaults.review.
  implement:
    needs: [plan-critique]
    agent: rust-engineer
    strategy: fan-out
    partition: by-blast-radius
    gates: [fmt, clippy, clippy-no-default, build, test, lane-core, style, no-os-kill, boundary,
             red-before-green]
    on_pass: merge
    coverage: "each unit is implemented, three-tier-reviews itself, and integrates on a green workspace"

  # 3. Check in ONCE, after every implement unit has integrated (spec 91). A `needs`
  #    entry naming the fan-out `implement` TEMPLATE is satisfied exactly when every
  #    unit it expanded into has integrated (an escalated or still-open unit leaves it
  #    unsatisfied, so the run's escalated fixpoint stays loud) - never before every
  #    unit has landed, and never per implementer round the way spec 73's original
  #    placement ran it. Re-verifies the whole gate suite against the now-merged tree;
  #    `max_retries: 2` overrides `defaults.max_retries` for this stage alone - one
  #    remediation round for the WHOLE spec diff, then integrate or escalate.
  checkin:
    needs: [implement]
    agent: rust-engineer
    max_retries: 2          # an ATTEMPT bound like defaults.max_retries: the gates, one remediation round, the gates again
    # The `mutation` gate is declared above but unwired from this stage until #32 lands.
    gates: [fmt, clippy, build, test, lane-no-default, lane-core, style-spec, no-os-kill-spec, boundary]
    on_pass: merge
    coverage: "the whole spec diff passes every gate on the merged tree"
