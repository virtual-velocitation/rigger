# Rigger developing Rigger: the self-hosting producing loop, expressed as
# Rigger CONTENT.
#
# This is the canonical example of a Rigger project - and it produces Rigger
# itself. Rigger is a pure-Rust crate now, so every gate below is a real cargo
# invocation matching the repo's CI (.github/workflows/rust.yml). Run it from
# the repo root with `rigger run <spec>` (the standalone CLI driver) or
# `rigger serve` (the Workflow + MCP driver, agents in-process). Validate it
# with `rigger validate`.
#
# The loop reinforces itself: every agent is grounded on only the code it needs,
# records each decision live to the shared event log (so the next stage and any
# concurrent agent see it), and must pass machine-verifiable gates. Failures
# escalate or are bounded-retried - never silently dropped.
#
# The review is PER UNIT, not a downstream stage. Each implementer unit runs its
# OWN lifecycle - ground -> implement (red/green TDD in a worktree) -> the unit's
# gates -> three-tier review OF THIS UNIT (lenses -> adversary -> adjudicator) ->
# integrate - and a reject or a gate failure feeds back into that same unit's
# remediation loop. `defaults.review` declares the panel once; every unit (the
# `implement` stage and every planner-proposed unit) inherits it.
name: rigger-self-hosted

defaults:
  autonomy: auto_notify     # manual | auto_notify | silent
  grounder: symbols         # symbols | grep | nop

  # The spawn-budget circuit-breaker (§4.4, §8): the hard cap on agent spawns a
  # single unattended run may make. When spawns reach it the breaker records
  # BudgetExhausted and aborts the run, so a runaway loop (e.g. a unit a reviewer
  # keeps rejecting) can never spawn unboundedly. NON-ZERO on purpose - 0 means
  # unlimited, which is what let a 5-hour churn run never trip. Raise it for a big
  # spec; never set it back to 0 for an unattended run.
  # 2026-07-02: raised 60 -> 200 for the spec-05 campaign run. The count folds
  # cumulatively from recorded SpawnRequested events (never resets per process), and
  # 60 was consumed by one 12-implementer fan-out wave plus reviews, remediation,
  # two zombie units (Gap 11), and several crashed-process retries. 200 bounds ten
  # units' full review lifecycles; still a hard cap, never 0.
  # 2026-07-03: raised 200 -> 400 for the spec-06 run. The unscoped stream (Gap 11)
  # already holds exactly 200 spawns, so a new run under 200 halts before its first
  # spawn. Spec 06 unit 1 scopes the fold per run, making this cumulative-count
  # artifact obsolete; revisit the number after it lands.
  budget: 400

  # The remediation depth (§4.4): how many attempts a failed unit gets before it
  # escalates to a human. This is the REFINEMENT-depth knob, NOT a review-rigor
  # knob - it gives a subtle unit room to CONVERGE under the full strict review
  # instead of escalating prematurely. Raise it when a unit's defects are genuine
  # but DIMINISHING across iterations (the lenses go clean, only the adversary's
  # deep findings remain) and the default 3 is too few to converge; it loosens the
  # depth limit, never the review bar. Absent falls back to 3 (the historical
  # default). Bounded by `budget` above, so it can never spin unboundedly.
  max_retries: 6

  # The per-spawn wall-clock bound in SECONDS (spec 10, unit 3): the liveness ceiling
  # every spawn inherits unless its agent's frontmatter sets its own `max_wall_clock`
  # (per-role override). A worker keeps a per-spawn heartbeat marker fresh under
  # <scratch>/agent-live while it works; `rigger step`'s liveness sweep treats a marker
  # stale beyond this bound as a HUNG agent - an INFRASTRUCTURE fault routed through the
  # failure taxonomy (infra), recorded on the spawn's id and charging the unit NO
  # remediation attempt (its code is not at fault) - so a hung agent halts the wave
  # VISIBLY instead of stalling it invisibly. Recover by recording a real result on the
  # named spawn (last-write-wins) and re-driving. 0 (absent) means unbounded - liveness
  # timeouts are opt-in and an un-set workflow is byte-for-byte back-compatible. 3600s
  # (1h) is a deliberately generous "definitely hung" ceiling for this repo's cargo-heavy
  # workers; a fast reviewer role can pin a tighter bound in its own frontmatter.
  max_wall_clock: 3600

  # How many implement units build at once (spec 89, per-unit pipelining). Each live unit
  # owns a debug build cache of about 50 GB on this crate, and a driver death makes every
  # live unit rebuild at once; five in parallel filled /home twice on 2026-09-15 (Steam
  # holds most of the disk). Two bounds the worst case to about 100 GB of caches.
  max_parallel_units: 2

  # The three-tier review panel applied to EVERY implementer unit (§3.2). TIER 1:
  # the expert lenses (architecture + sdet) review the unit's diff in parallel.
  # TIER 2: the adversary reviews THE LENSES' findings and tries to prove them
  # wrong - higher bar, surfaces what they all missed, refutes overreach (it
  # reviews the reviews; it is not a parallel lens). TIER 3: the adjudicator is the
  # neutral final judge - it weighs the lenses against the adversary, is EXTREMELY
  # strict on design/architecture adherence, and its approve/reject verdict GATES
  # the unit's integration. Declared once; inherited by the implement stage and
  # every planner-proposed unit.
  review:
    lenses: [architecture-reviewer, sdet]   # tier 1: the expert lenses
    adversary: adversary                    # tier 2: refutes the lenses
    adjudicator: adjudicator                # tier 3: neutral judge; verdict gates

  # The declarative failure taxonomy (spec 10, unit 2). An ORDERED, first-match-wins
  # list of rules that classify a failure signal (a process's `exit_status`, terminating
  # `signal`, and/or an `output_regex` over its captured output) into a `class` -
  # `infra` | `product` | `flaky` - with a per-rule rerun `limit` and exponential
  # `backoff` ({duration_ms, factor, max_ms}). It replaces the infra-vs-product split the
  # conductor hand-coded across its gate/spawn sites (R1). At an inline gate the class
  # drives the three-way outcome: a `product` failure fails immediately and demotes the
  # autonomy ratchet (today's behavior); a `flaky`/`infra` failure is rerun up to `limit`
  # and a MIXED result (it passed on a rerun) is a FlakyVerdict pass-with-warning that
  # NEVER demotes; a `flaky` that stays red demotes, an `infra` that stays red does not.
  #
  # OMITTED (as here) means the shipped code default (`failure::Taxonomy::default`) is
  # used, whose rules preserve spec-07 semantics: recognised transient infra faults
  # (out of disk, refused/reset connection, DNS failure) classify `infra` and reran;
  # everything else is `product` (no rerun). Uncomment to author your own, e.g.:
  #
  # failure_rules:
  #   - match: {output_regex: "SIGSEGV|thread panicked while panicking"}
  #     class: flaky
  #     limit: 2
  #     backoff: {duration_ms: 1000, factor: 2.0, max_ms: 30000}
  #   - match: {exit_status: 137}          # OOM-killed worker
  #     class: infra
  #     limit: 1
  #   - match: {}                          # catch-all: any other failure is a defect
  #     class: product

build:
  # spec 91 retires the per-round `mutation` switch entirely (an explicit value of any
  # kind is now a validation error naming this spec): no per-round sweep; mutation runs
  # ONCE at the `checkin` stage below via the `mutation` gate, remediated once.
  max_concurrent: 1         # serialize builds machine-wide: two concurrent cargo-mutants sweeps (~100G each) exhausted /home this session. Blunt cap (operator-binary boundary blocks a surgical mutation-only slot); revisit as a spec.

# Registered regenerable artifacts (spec 88, criterion 1): an integration merge conflict
# CONFINED entirely to paths one of these rules matches is resolved by the conductor
# itself - running `run` in the unit's worktree and committing - with no implementer
# spawn at all. `docs/audit/*` is the simplification-audit catalog/report spec 85/87's
# units regenerate today by hand with RIGGER_AUDIT_WRITE=1; registering it here lets a
# conflict confined to those files (a common parallel-unit collision, since every unit
# that touches audited code also updates them) resolve itself.
# Only the FULLY generated artifacts are regenerable. The report
# (docs/audit/2026-09-simplification-audit.md) is partly hand-written - the generator
# rewrites only its section 2 - so a merge conflict in it is source: it goes to the
# implementer's conflict-resolution retry like any other file (2026-09-15: a `docs/audit/*`
# rule left 475 conflict-marker lines in the report after a "successful" regeneration and
# the half-merge checkpoint guard rightly refused the commit; run c6ccaf8e, u89c2).
regenerate:
  - paths: ["docs/audit/*.json"]
    run: "RIGGER_AUDIT_WRITE=1 cargo test --test simplification_audit"

gates:                      # the project's verification library, referenced by name
  fmt:    { run: "cargo fmt --check",                        kind: core }
  clippy: { run: "cargo clippy --all-targets -- -D warnings", kind: core }
  build:  { run: "cargo build",                              kind: core }
  test:   { run: "cargo test",                               kind: core }
  # The style gate (Gap 4a): a mechanically-checkable style constraint becomes a
  # gate rather than relying on ambient reviewer attention. It FAILS when the
  # unit's OWN diff against the run base introduces an em dash (U+2014) in any
  # added text - code, comments, docs, prompts - and PASSES on a clean diff. It
  # runs in the unit worktree (cwd), so a three-dot diff from the run branch
  # (`rigger-run`, with an origin/main / HEAD fallback) reports only THIS branch's
  # changes, never the whole tree. The em dash byte pattern is generated at runtime
  # via `printf` octal (portable to POSIX sh / dash and bash), so this gate command
  # carries no literal em dash and therefore passes on its own diff.
  style:
    run: 'em=$(printf "\342\200\224"); base=$(git rev-parse --verify -q rigger-run || git rev-parse --verify -q origin/main || git rev-parse --verify -q HEAD); if git diff "$base"...HEAD | grep "^+" | grep -v "^+++ " | grep -qF "$em"; then echo "style gate FAILED: an em dash (U+2014) was introduced; use a hyphen"; exit 1; fi'
    kind: core
  # The no-os-kill gate (spec 78): rigger issues NO OS-level kills. Process lifecycle is
  # handle-bound (`Child::kill()`/`wait()` on a child this process spawned) or, in exactly
  # two sanctioned places, an internal guarded signal call: the worktree reaper
  # (src/reap.rs) and the shared test lifecycle helper (tests/common/mod.rs). Everywhere
  # else in src/ and tests/, an added line that shells out to kill/pkill/killall, formats a
  # negative (process-group) pid, uses the `--` argv separator, or calls a signal API
  # directly FAILS the unit. Inside the two sanctioned files a shell-out is still a failure.
  # Scoped to code (src, tests): prose in docs/, specs/ and .rigger/ may name the rule.
  # WHY: computed kill targets (a pgid, a marker pid, a /proc scan) resolved to kill(-1)
  # and destroyed the operator's whole desktop session seven-plus times; the review
  # panel approved each site because nothing mechanical forbade it. Now something does.
  no-os-kill:
    run: 'base=$(git rev-parse --verify -q rigger-run || git rev-parse --verify -q origin/main || git rev-parse --verify -q HEAD); bad="Command::new\(.(kill|pkill|killall|xkill)|[^a-zA-Z_]kill(all)? -[0-9A-Za-z]|[^a-zA-Z_]pkill[^a-zA-Z_]|killpg|libc::kill\(|signal::kill\(|kill_process\(|\.arg\(.--.\)|format!\(.-\{"; if git diff "$base"...HEAD -- src tests ":(exclude)src/reap.rs" ":(exclude)tests/common/mod.rs" | grep "^+" | grep -v "^+++ " | grep -qE "$bad"; then echo "no-os-kill gate FAILED: an OS-level kill, a process-group target, or a direct signal call was introduced outside the sanctioned lifecycle helpers (src/reap.rs, tests/common/mod.rs). Lifecycle is handle-bound: Child::kill()/wait(), or the shared helper. See specs/78-no-os-level-kills.md"; exit 1; fi; if git diff "$base"...HEAD -- src/reap.rs tests/common/mod.rs | grep "^+" | grep -v "^+++ " | grep -qE "Command::new\(.(kill|pkill|killall|xkill)|\.arg\(.--.\)|format!\(.-\{"; then echo "no-os-kill gate FAILED: a sanctioned lifecycle file shelled out to kill or formatted a process-group target; use the internal guarded signal call only"; exit 1; fi'
    kind: core
  # The check-in-stage mutation gate (spec 91): runs the diff-scoped `cargo mutants`
  # sweep ONCE, at the `checkin` stage below - after every implement unit has
  # integrated - rather than once per implementer round (spec 73's original per-round
  # placement, retired). `$MUTANTS` is the unit-keyed mutants root the conductor
  # exports to every gate command exactly like `CARGO_TARGET_DIR` already is
  # (`worktree::unit_mutants_sibling`), and reaps at unit terminus alongside it
  # (`worktree::reclaim_cache_sibling`) - this command owns creating/wiping it each
  # run, never this crate. `$RIGGER_RUN_BASE` is the run branch's tip commit sha AT
  # THE MOMENT this run started (`RunStarted.base_tip`, exported to every gate
  # command the same way `$MUTANTS` is) - NEVER a `git merge-base` with the run
  # branch: the checkin stage's own worktree branches off the run branch AFTER every
  # implement unit has already integrated, so a merge-base there is already HEAD and
  # would diff nothing (the whole-spec sweep would then certify zero mutants, every
  # run, silently). A run whose `RunStarted` predates this field has no base to diff
  # against; `test -n` refuses loud rather than sweeping an empty diff. The checkin
  # stage's own task text (below, and the `rust-engineer` persona's checkin-stage
  # prose) carries the kill-or-justify protocol: read `mutants.out/outcomes.json`,
  # kill each missed mutant with a strengthened test or justify it via an
  # `exclude_re` entry in `.cargo/mutants.toml` with a one-line reason, commit, and
  # record the deterministic per-mutant accounting as a DecisionMade. Declaring a
  # gate under this exact id requires `cargo-mutants` on PATH (`rigger validate`
  # checks at run start). The gate fails on MISSED mutants only (spec 91: "fails while a
  # missed mutant is neither killed nor justified"). A TIMEOUT is a detection, not a miss:
  # the suite hangs or overruns under the mutant (a server that returns at once, an
  # inverted loop guard - hang-class mutants the suite catches only by bounded waits), and
  # cargo-mutants exits 3 for it. On the first live check-in (spec 89, 2026-09-14) the same
  # four hang-class mutants timed out at 1.5x AND 3x the baseline with zero misses, and a
  # remediation round of fast-failing contract tests still left two: cargo stops at the
  # first FAILING test binary, and the binaries with the bounded waits run before the one
  # that fails fast, so no test can make the whole suite finish early. Two green units
  # escalated on that treadmill. The budget stays at 3x (two suites run at once); the
  # sweep's own missed.txt is the verdict, and the accounting names every timeout.
  #
  # Sweep shape (2026-09-16, spec 92's 433-mutant check-in measured at 45 s per mutant
  # and 5.4 h per pass): the tests run under nextest (`.config/nextest.toml`), which runs
  # every binary's tests at once and stops at the first failure, so a caught mutant ends
  # its test phase when ANY test fails and a hung test dies at the per-test bound instead
  # of at 3x the whole suite. `env -u CARGO_TARGET_DIR` gives each mutant copy its own
  # build dir: with the unit cache exported, every copy built into the same target,
  # serialized on cargo's lock (so `-j` bought nothing) and left the cache holding
  # artifacts of mutated trees. `CARGO_BUILD_JOBS=8` lifts `.cargo/config.toml`'s 4-job
  # cap for the sweep alone; three copies at 8 jobs stay inside the sweep's memory scope.
  # `--cargo-arg=--target-dir=target` pins each copy's build dir INSIDE the copy: the scratch
  # root's own `.cargo/config.toml` (`worktree.rs`, the ambient catch-all that sends any
  # cargo run without CARGO_TARGET_DIR to `cargo-target-shared`) is found by cargo's config
  # walk from every copy, so without the flag all three copies built into that one dir,
  # serialized on its artifact lock and replaced each other's test binaries under running
  # tests (a copy's later tests executed another mutant's binaries).
  # `CARGO_PROFILE_DEV_DEBUG=1` / `CARGO_PROFILE_TEST_DEBUG=1` (line tables only) shrink what
  # every mutant relinks: with full debug info the 188 test binaries are 200-290 MB each, so
  # three isolated build dirs (28 GB apiece) overflow the sweep's page cache and a relink that
  # took 7 s against one hot dir took 81 s (measured 2026-09-16, 1.2 mutants a minute).
  # Panic locations keep file:line; only symbolized backtraces lose detail, which no test reads.
  #
  # INCREMENTAL RE-SWEEPS (Byran, 2026-09-16: "only run mutations when the test has changed or
  # the logic has changed"). The sweep leaves three facts under `$MUTANTS/last/` - the tree it
  # examined (`tip`), its misses (`missed.txt`) and, per caught mutant, the test binary whose
  # first failure caught it (`caught.map`, read off the nextest FAIL line in each mutant's
  # log). `$MUTANTS` is the unit-keyed root rigger hands to BOTH the pre-merge and the
  # post-merge run, so the next sweep on this unit reads them before wiping the root. When
  # that tip is an ancestor of HEAD the sweep covers (a) every mutant in the diff since it -
  # the changed logic - and (b) by name (`-F`, line numbers wildcarded so a shifted line
  # still matches), every earlier miss plus every caught mutant whose catching binary's
  # `tests/<binary>.rs` changed since the tip (a change under a shared tests/ directory
  # re-runs them all); the rerun goes to `$MUTANTS/rerun`, must examine at least one mutant,
  # and its misses join the sweep's own missed.txt so one file is the verdict (the previous
  # sweep's mutants.out is removed up front: a delta with no mutable code writes nothing, and
  # a stale missed.txt must never be the verdict). A mutant caught
  # on unchanged code by an unchanged test stays caught. No `last/tip`, a tip that is not an
  # ancestor (a reclaimed unit, a fresh spec) or the run's first sweep: the whole spec diff
  # against `$RIGGER_RUN_BASE`, exactly as before. A solo-merging unit's post-merge re-sweep is
  # therefore the empty merge delta and passes in seconds - the merged tree IS the examined one.
  mutation:
    run: >-
      test -n "$RIGGER_RUN_BASE" &&
      last="${MUTANTS:-/nonexistent}/last" &&
      anchor="$(cat "$last/tip" 2>/dev/null || true)" &&
      { test -n "$anchor" && test "$(git rev-list --count HEAD.."$anchor" 2>/dev/null || echo 1)" = 0 || anchor=""; } &&
      rerun="$( if test -n "$anchor"; then
      cat "$last/missed.txt" 2>/dev/null;
      changed="$(git diff --name-only "$anchor" -- tests | sed -E 's#^tests/([^/]+)\.rs$#\1#; s#^tests/.*/.*#ALL#' | sort -u)";
      test -z "$changed" || awk -F '\t' -v ch="$changed" 'BEGIN { n = split(ch, a, "\n"); for (i = 1; i <= n; i++) set[a[i]] = 1 } ($2 in set) || ("ALL" in set) { print $1 }' "$last/caught.map" 2>/dev/null;
      fi | sort -u )" &&
      { if test -n "$anchor"; then git diff "$anchor" -- '*.rs' > unit.diff; else git diff "$RIGGER_RUN_BASE" -- '*.rs' > unit.diff; fi; } &&
      rm -rf "$MUTANTS" mutants.out mutants.out.old && mkdir -p "$MUTANTS/last" mutants.out &&
      { test -z "$rerun" || printf '%s\n' "$rerun" | sed -E 's/[][\\.*^$+?(){}|]/\\&/g; s/^([^:]+):[0-9]+:[0-9]+:/\1(:[0-9]+:[0-9]+)?:/; s/^/-F\n/' > "$MUTANTS/rerun.args"; } &&
      { TMPDIR="$MUTANTS" CARGO_BUILD_JOBS=8 CARGO_PROFILE_DEV_DEBUG=1 CARGO_PROFILE_TEST_DEBUG=1 env -u CARGO_TARGET_DIR
      cargo mutants --in-diff unit.diff --test-tool nextest --cargo-arg=--target-dir=target --timeout-multiplier 3 -j 3;
      rc=$?; test "$rc" -eq 0 -o "$rc" -eq 3; } &&
      { test ! -s "$MUTANTS/rerun.args" ||
      { TMPDIR="$MUTANTS" CARGO_BUILD_JOBS=8 CARGO_PROFILE_DEV_DEBUG=1 CARGO_PROFILE_TEST_DEBUG=1 env -u CARGO_TARGET_DIR
      xargs -d '\n' -a "$MUTANTS/rerun.args" cargo mutants --output "$MUTANTS/rerun" --baseline skip --timeout 300 --test-tool nextest --cargo-arg=--target-dir=target -j 3;
      rc=$?; test "$rc" -eq 0 -o "$rc" -eq 3; } &&
      test "$(grep -c '"summary"' "$MUTANTS/rerun/mutants.out/outcomes.json")" -ge 1 &&
      { cat "$MUTANTS/rerun/mutants.out/missed.txt" >> mutants.out/missed.txt 2>/dev/null; true; }; } &&
      git rev-parse HEAD > "$MUTANTS/last/tip" &&
      { cp mutants.out/missed.txt "$MUTANTS/last/missed.txt" 2>/dev/null || : > "$MUTANTS/last/missed.txt"; } &&
      { for f in mutants.out/log/*.log "$MUTANTS"/rerun/mutants.out/log/*.log; do test -f "$f" || continue;
      awk 'name == "" && /^\*\*\* / { sub(/^\*\*\* /, ""); name = $0; next } /FAIL \[/ { gsub(/\033\[[0-9;]*m/, ""); if (match($0, /\/[0-9]+\) [^ ]+/)) { b = substr($0, RSTART, RLENGTH); sub(/^\/[0-9]+\) /, "", b); sub(/^rigger::/, "", b); print name "\t" b; exit } }' "$f"; done > "$MUTANTS/last/caught.map"; } &&
      test ! -s mutants.out/missed.txt
    kind: core

stages:
  # 1. Refine the spec's decomposition. The conductor itself creates one baseline
  #    implement unit per acceptance criterion (the deterministic decomposition);
  #    the planner REFINES that baseline - splitting a criterion into several units,
  #    or adding a necessary sub-unit / dependency - via UnitProposed. A produces
  #    stage decomposes the whole spec, so it has no single coverage criterion: it
  #    grounds on the spec's acceptance criteria, not on a `coverage` label.
  plan:
    agent: planner
    produces: dag           # refine the spec's unit DAG at runtime

  # 1b. Adversarial plan-critique gate (spec 10, Unit 1). Before ANY implementer
  #    spawns, the existing adversary + adjudicator review the PROPOSED unit DAG the
  #    planner produced. The gate judges the decomposition for the two cross-unit hazards
  #    a per-unit review cannot see: ambiguous mitigation OWNERSHIP (rule 7 - one demanded
  #    fix owned by two units with no exclusion named) and open DISPOSITIONS (rule 8 - a
  #    criterion a reviewer can re-litigate). A shared blast radius is NOT one of them: it
  #    is surfaced as INFORMATIONAL context only, because `partition: by-blast-radius`
  #    serializes overlapping units into disjoint sequential batches and worktree
  #    isolation keeps every reviewer on its own diff, so overlap integrates cleanly (see
  #    handbook rule 6). A reject feeds back to the planner (bounded by max_retries); only
  #    an approve RELEASES the fan-out. It is review-only (no `agent`) - it critiques the
  #    plan, it does not implement - and it needs `plan`, so the conductor runs it between
  #    planning and the fan-out. The informational blast-radius context excludes
  #    already-integrated and terminal units (`dag_unit_blast_radii`), so a settled unit
  #    is never presented as a live overlap the planner cannot resolve. Owns: pre-fan-out
  #    decomposition review. Per-unit review is untouched.
  plan-critique:
    needs: [plan]
    adversary: adversary        # tier 2: reviews the DAG and refutes it
    adjudicator: adjudicator    # tier 3: its approve/reject gates the fan-out

  # 2. Implement, review, and integrate PER UNIT. One Rust implementer per ready
  #    unit, each in an isolated worktree, partitioned by blast-radius so the waves
  #    stay disjoint. Each unit's complete lifecycle runs inside this one stage:
  #    red -> green is enforced around the change, the full gate set
  #    (fmt + clippy + build + test + style) must pass, THEN the unit reviews ITSELF through
  #    `defaults.review`'s three tiers, and only on adjudicator-approve + green gates
  #    does it integrate (on_pass: merge). A reject or a gate failure feeds back into
  #    this same unit's remediation loop (re-ground, re-implement with the feedback)
  #    and escalates after the retry bound - it does NOT integrate. Every
  #    planner-proposed unit inherits the same per-unit review via defaults.review.
  implement:
    needs: [plan-critique]
    agent: rust-engineer
    strategy: fan-out
    partition: by-blast-radius
    gates: [fmt, clippy, build, test, style, no-os-kill]
    on_pass: merge
    coverage: "each unit is implemented, three-tier-reviews itself, and integrates on a green workspace"

  # 3. Check in ONCE, after every implement unit has integrated (spec 91). A `needs`
  #    entry naming the fan-out `implement` TEMPLATE is satisfied exactly when every
  #    unit it expanded into has integrated (an escalated or still-open unit leaves it
  #    unsatisfied, so the run's escalated fixpoint stays loud) - never before every
  #    unit has landed, and never per implementer round the way spec 73's original
  #    placement ran it. Re-verifies the whole gate suite against the now-merged tree,
  #    THEN sweeps mutants; `max_retries: 2` overrides `defaults.max_retries` for this
  #    stage alone - one remediation round for the WHOLE spec diff's mutants, then
  #    integrate or escalate with the accounting already on record.
  checkin:
    needs: [implement]
    agent: rust-engineer
    max_retries: 2          # an ATTEMPT bound like defaults.max_retries: the sweep, one remediation round, the sweep again (1 escalated on the first miss - run c6ccaf8e)
    gates: [fmt, clippy, build, test, style, no-os-kill, mutation]
    on_pass: merge
    coverage: "mutation efficacy of the whole spec diff"
