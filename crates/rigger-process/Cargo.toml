[package]
name = "rigger-process"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rigger's process adapters: the one process-spawn interface, the directory-rooted reaper, the machine-wide build-slot budget, the ordered parallel map, the keep-awake adapter, the detached start and the interrupt trigger."

[lib]
name = "rigger_process"
path = "src/lib.rs"

[features]
# Mirrors the root crate's lane features (see the root manifest): a module gated
# `any(feature = "store", not(feature = "core"))` there carries the same gate here, and the
# root forwards both features, so every lane compiles exactly the surface it did before.
default = ["store"]
store = ["rigger-domain/store"]
core = ["rigger-domain/core"]

[dependencies]
# The keep-awake adapter implements the domain's `SleepHold` interface (spec 105).
rigger-domain = { path = "../rigger-domain", default-features = false }

# The native-only adapter dependencies, target-gated exactly as in the root manifest: the
# `wasm32` core lane never builds them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The reaper's ONLY sanctioned way to signal a process it does not own a `Child` handle to
# (spec 78), and this crate's other system calls: the process ids and owners it reads,
# `inherit_on_exec`'s descriptor-flag call, and the Linux keeper's child subreaper and its wait on
# its children. See the root manifest for why the 1.x line with only `std` + `process`.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
# The build budget's cross-process advisory slot lock (`flock(2)` on unix, `LockFileEx` on
# Windows).
fs2 = "0.4"
# The gate channel's name rule, on every OS: the SHA-256 of the canonical repo root names the
# Unix domain socket and the Windows named pipe alike, from the `ring` the lock already resolves
# for the conductor.
ring = "0.17"

# The Linux keep-awake adapter's bus clients (specs 105 and 125): logind's on the system bus and,
# in a graphical session, the desktop portal's on the session bus, both zbus's async API on its
# tokio integration. Each runs on a current-thread tokio runtime of its own: logind's is built and
# shut down within the acquire, and the portal's lives on the one thread the guard holds, so the
# adapter adds no executor sized by core count. `tokio` is a direct edge to the tokio the store
# already links.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.15", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time"] }

# The Windows keep-awake adapter's power request (spec 105), at the 0.61 line the lock already
# resolves for rustix, tempfile and zbus: `PowerCreateRequest` takes its `REASON_CONTEXT` from
# Threading and its context version from SystemServices. The detached start's creation flags come
# from Threading too, and the interrupt trigger's console control handler from Console. The process
# interface's Windows adapter (spec 125) reads the process snapshot from ToolHelp, each process's
# times and image name from Threading, its command line from the WDK's Threading
# (`NtQueryInformationProcess`, which Win32 has no counterpart of) split into its arguments by
# Shell (`CommandLineToArgvW`), the TCP listener table from
# IpHelper with its address family from WinSock, and a directory's holders from RestartManager; the
# reaper's Windows signal opens and ends a process through Threading. A jobbed tree is held in a job
# from JobObjects, which the reaper ends and counts, and its main, created suspended, is resumed
# through a ToolHelp thread snapshot and Threading. The gate channel's named pipe is created,
# connected and waited for through Pipes, read and written overlapped through FileSystem and IO with
# its event from Threading, and held to its owner by a descriptor from Security and Authorization.
# The macOS adapters declare no crate: the keep-awake adapter reaches IOKit and CoreFoundation
# through `extern` declarations, and the process interface reads libproc and the argument-area
# sysctl through the libc below.
[target.'cfg(unix)'.dependencies]
# The unix interrupt trigger's `SIGINT` handler: `signal`, and the async-signal-safe `ftruncate`
# and `_exit` it calls; the Linux keeper's signal dispositions (`sigaction`, `signal`), its wait on
# its control pipe (`poll`), and its standard streams put over by `/dev/null` (`open`, `dup2`,
# `close`) and its descriptors' close-on-exec (`fcntl`); and the macOS process adapter's libproc
# reads and its argument read (`sysctl`), from the libc the lock already resolves for rustix's
# dependents.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_RestartManager", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Wdk_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

# The Linux keep-awake adapter's tests: the live test's own calls to logind, over zbus's blocking
# API, and the fake logind and fake portal private buses serve, built as a bus implementation.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5.15", default-features = false, features = ["blocking-api", "bus-impl", "tokio"] }

[lints]
workspace = true
