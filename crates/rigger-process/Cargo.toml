[package]
name = "rigger-process"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rigger's process adapters: the one process-spawn port, the directory-rooted reaper, the machine-wide build-slot budget, the ordered parallel map, the keep-awake adapter, the detached start and the interrupt trigger."

[lib]
name = "rigger_process"
path = "src/lib.rs"

[features]
# Mirrors the root crate's lane features (see the root manifest): a module gated
# `any(feature = "store", not(feature = "core"))` there carries the same gate here, and the
# root forwards both features, so every lane compiles exactly the surface it did before.
default = ["store"]
store = ["rigger-domain/store"]
core = ["rigger-domain/core"]

[dependencies]
# The keep-awake adapter implements the domain's `SleepHold` port (spec 105).
rigger-domain = { path = "../rigger-domain", default-features = false }

# The native-only adapter dependencies, target-gated exactly as in the root manifest: the
# `wasm32` core lane never builds them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The reaper's ONLY sanctioned way to signal a process it does not own a `Child` handle to
# (spec 78); see the root manifest for why the 1.x line with only `std` + `process`.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
# The build budget's cross-process advisory slot lock (`flock` under the hood).
fs2 = "0.4"

# The Linux keep-awake adapter's bus clients (specs 105 and 125): logind's on the system bus and,
# in a graphical session, the desktop portal's on the session bus, both zbus's async API on its
# tokio integration. Each runs on a current-thread tokio runtime of its own: logind's is built and
# shut down within the acquire, and the portal's lives on the one thread the guard holds, so the
# adapter adds no executor sized by core count. `tokio` is a direct edge to the tokio the store
# already links.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.15", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time"] }

# The Windows keep-awake adapter's power request (spec 105), at the 0.61 line the lock already
# resolves for rustix, tempfile and zbus: `PowerCreateRequest` takes its `REASON_CONTEXT` from
# Threading and its context version from SystemServices. The detached start's creation flags come
# from Threading too, and the interrupt trigger's console control handler from Console. The
# process interface's Windows adapter (spec 125) reads the process snapshot from ToolHelp, each
# process's times and image name from Threading, the TCP listener table from IpHelper with its
# address family from WinSock, and a directory's holders from RestartManager; the reaper's Windows
# signal opens and ends a process through Threading. The macOS adapters declare no crate: the
# keep-awake adapter reaches IOKit and CoreFoundation through `extern` declarations, and the
# process interface reads libproc through the libc below.
# The gate socket's path rule (Unix domain sockets, so Unix alone): the SHA-256 of the canonical
# repo root names the socket, from the `ring` the lock already resolves for the conductor.
[target.'cfg(unix)'.dependencies]
ring = "0.17"
# The unix interrupt trigger's `SIGINT` handler: `signal`, and the async-signal-safe `ftruncate`
# and `_exit` it calls, and the macOS process adapter's libproc reads, from the libc the lock
# already resolves for rustix's dependents.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_RestartManager"] }

[dev-dependencies]
tempfile = "3"

# The Linux keep-awake adapter's tests: the live test's own calls to logind, over zbus's blocking
# API, and the fake logind and fake portal private buses serve, built as a bus implementation.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5.15", default-features = false, features = ["blocking-api", "bus-impl", "tokio"] }

[lints]
workspace = true
