[package]
name = "rigger-console"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rigger's console delivery: the one pure fold of a recorded event stream (unit statuses, blocker lines, the needs-you dock, the statusline) and the code map, shared by `rigger status` and the Mission Control console page."

[lib]
name = "rigger_console"
path = "src/lib.rs"

[features]
# Mirrors the root crate's lane features (see the root manifest): the console is `core` (always
# compiled, no gate), so the features only forward the lane to the domain it folds over; the root
# forwards both, so every lane compiles exactly the surface it did before.
default = ["store"]
store = ["rigger-domain/store"]
core = ["rigger-domain/core"]

[dependencies]
rigger-domain = { path = "../rigger-domain", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
