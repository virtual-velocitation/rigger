[package]
name = "rigger-grounder"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rigger's grounding adapters: the grounders behind the Grounder interface (the structural symbols grounder, grep and nop), the shared scoped project walk, the extraction of file bytes into code store facts, and the combined lookup."

[lib]
name = "rigger_grounder"
path = "src/lib.rs"

[features]
# Mirrors the root crate's lane features (see the root manifest): a module gated
# `any(feature = "store", not(feature = "core"))` or `feature = "symbols"` there carries the same
# gate here, and the root forwards all three features, so every lane compiles exactly the
# surface it did before.
default = ["symbols", "store"]
store = ["rigger-domain/store", "rigger-config-files/store", "rigger-store/store"]
core = ["rigger-domain/core", "rigger-config-files/core", "rigger-store/core"]
symbols = [
    "dep:tree-sitter",
    "dep:tree-sitter-tags",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-python",
]

[dependencies]
rigger-domain = { path = "../rigger-domain", default-features = false }
# The workflow-definition extraction parses `.rigger/workflow.yml` through the operator-tree
# reader (a same-ring edge).
rigger-config-files = { path = "../rigger-config-files", default-features = false }
# The code store the symbols grounder reads and the scoped project walk.
rigger-store = { path = "../rigger-store", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structural grounding (spec 15, `symbols` feature). tree-sitter parses source into a
# concrete syntax tree; tree-sitter-tags runs each grammar's `tags` query to yield uniform
# definition/reference tags. `tree-sitter-tags` requires an exact `tree-sitter` MINOR, so it
# pins the runtime version; grammar crates couple only through `tree-sitter-language`, so a
# grammar's `LANGUAGE` (a `LanguageFn`) converts to `tree_sitter::Language` via `.into()`
# regardless of which `tree-sitter` minor built it. Unit 1 ships the Rust grammar; unit 2
# adds the remaining four on this same base. All optional, all under the `symbols` feature.
tree-sitter = { version = "0.25", optional = true }
tree-sitter-tags = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
# The remaining four shipped languages (unit 2). Each couples to the runtime only through
# `tree-sitter-language` (its `LANGUAGE` is a `LanguageFn` that `.into()`s to
# `tree_sitter::Language`), so the pinned `tree-sitter` / `tree-sitter-tags` 0.25 ABI drives
# resolution and these grammar minors are chosen to match it. All optional, all under the
# `symbols` feature. The JavaScript/TypeScript family is two crates (one grammar each);
# `tree-sitter-typescript` exposes `LANGUAGE_TYPESCRIPT` (and `LANGUAGE_TSX`), so `.ts`/`.tsx`
# both resolve through it.
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }

# Target-gated exactly as in the root manifest: the `wasm32` core lane never builds it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The combined lookup (`lookup`): fst's Levenshtein automaton resolves a term against the graph's
# entity names, the ripgrep libraries scan the caller's working tree live, and tantivy ranks the
# prose in an in-memory index (its RAM directory only, so its default mmap/compression features
# stay off).
fst = { version = "0.4", features = ["levenshtein"] }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
tantivy = { version = "0.24", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
