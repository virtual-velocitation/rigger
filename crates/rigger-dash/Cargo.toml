[package]
name = "rigger-dash"
# The root package's version: the dashboard stamps `CARGO_PKG_VERSION` into every response's
# `X-Rigger-Dash` header, so this crate carries the version the root crate did.
version = "0.3.0"
edition = "2021"
publish = false
description = "Rigger's delivery ring: the HTTP dashboard (the run view, the knowledge graph explorer and the Mission Control console page with its embedded WebAssembly core) and the MCP server agents talk to."
build = "build.rs"

[lib]
name = "rigger_dash"
path = "src/lib.rs"

[features]
# Mirrors the root crate's lane features (see the root manifest): a module gated
# `any(feature = "store", not(feature = "core"))` there carries the same gate here (and the build
# script reads the same predicate to decide whether to embed the console core), and the root
# forwards both features, so every lane compiles exactly the surface it did before.
default = ["store"]
store = [
    "rigger-domain/store",
    "rigger-store-sqlite/store",
    "rigger-graph-sqlite/store",
    "rigger-process/store",
    "rigger-driver/store",
    "rigger-grounder/store",
    "rigger-conductor/store",
    "rigger-console/store",
]
core = [
    "rigger-domain/core",
    "rigger-store-sqlite/core",
    "rigger-graph-sqlite/core",
    "rigger-process/core",
    "rigger-driver/core",
    "rigger-grounder/core",
    "rigger-conductor/core",
    "rigger-console/core",
    "rigger-config-files/core",
]

[dependencies]
rigger-domain = { path = "../rigger-domain", default-features = false }
rigger-store-sqlite = { path = "../rigger-store-sqlite", default-features = false }
rigger-graph-sqlite = { path = "../rigger-graph-sqlite", default-features = false }
rigger-process = { path = "../rigger-process", default-features = false }
rigger-driver = { path = "../rigger-driver", default-features = false }
rigger-grounder = { path = "../rigger-grounder", default-features = false }
rigger-conductor = { path = "../rigger-conductor", default-features = false }
rigger-console = { path = "../rigger-console", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# The MCP server's tests build agent definitions from the loaded config. `core` above forwards to
# it, so this crate's core-lane tests build it in the same lane as every other dependency.
rigger-config-files = { path = "../rigger-config-files", default-features = false }
serial_test = "3"

[lints]
workspace = true
