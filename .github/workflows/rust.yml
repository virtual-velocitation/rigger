name: rust

on:
  push:
    branches: [main]
  pull_request:

# The cargo test runner (.cargo/pidns-runner.sh) wraps every test binary in a user+pid
# namespace and FAILS CLOSED where one cannot be created. A hosted CI runner is a
# throwaway VM with no operator session to protect, and Ubuntu's AppArmor restricts
# unprivileged user namespaces there, so opt out explicitly - at the workflow level, so
# EVERY job that runs a test binary inherits it (the kurrentdb job failed exactly this
# way when the opt-out lived only in build-test). Never set this on a workstation.
#
# The git-hermeticity block below (spec 90) mirrors .cargo/pidns-runner.sh's own exported
# set verbatim - tests/hermetic_test_git_audit.rs cross-checks the two never drift apart -
# at workflow level for the identical reason RIGGER_PIDNS is here: EVERY job that runs a
# test binary inherits it, same fixed identity and no-signing/no-prompt guarantee CI gets
# whether or not a given job's cargo invocation happens to reach the runner script itself.
env:
  RIGGER_PIDNS: "off"
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: "commit.gpgsign"
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: "tag.gpgsign"
  GIT_CONFIG_VALUE_1: "false"
  GIT_AUTHOR_NAME: "rigger-test"
  GIT_AUTHOR_EMAIL: "rigger-test@localhost"
  GIT_COMMITTER_NAME: "rigger-test"
  GIT_COMMITTER_EMAIL: "rigger-test@localhost"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  build-test:
    # Every lane below names the whole workspace: `--all` on fmt, `--workspace` on clippy, build
    # and test. A bare `cargo clippy`, `cargo build` or `cargo test` at the repository root
    # reaches the root package alone, so no member crate's own tests would run and none of its
    # clippy targets would be linted here - the blind spot of a multi-crate workspace whose root
    # is itself a package. The per-unit gates in .rigger/workflow.yml name the workspace for the
    # same reason, so CI runs the battery a unit runs. CI runs the no-default and core lanes
    # through .rigger/gates/lanes.sh, which names the workspace (and, on the core lane, every
    # member with a `core` feature) itself.
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 8
      # Full debuginfo in the hundreds of test binaries the three feature lanes build exceeds the
      # runner's disk; line tables keep the file:line of panic messages and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          # go-gitsemver derives the embedded version from tag history (Mainline mode
          # walks to the nearest reachable tag), so a shallow, tagless checkout would
          # derive garbage; full history keeps the derivation identical to a workstation.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # Spec 93 criterion 3: build.rs nested-cross-compiles crates/console-core for
          # wasm32-unknown-unknown whenever a cargo invocation compiles crates/rigger-dash/src/dash.rs -
          # both the default and --no-default-features lanes in this job do - so the
          # target must be present before either runs. A workflow-level install, never
          # a per-unit one.
          targets: wasm32-unknown-unknown
      # The version-derivation periphery tests assert this binary's embedded version is
      # genuinely derived (not +unversioned), which requires go-gitsemver on PATH when the
      # test binary is BUILT (spec 74: derivation is delegated, go-gitsemver.yml is the
      # config authority). Pinned to the version verified on the workstation.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: install go-gitsemver (version derivation, spec 74)
        run: go install github.com/MyCarrier-DevOps/go-gitsemver@v1.11.0
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --verbose
      - name: test
        run: cargo test --workspace --no-fail-fast --verbose
      # The deliberate light opt-out: `--no-default-features` drops the `symbols` grounder, so the
      # grep-only build stays green. The lanes script gives it the default lane's battery - clippy
      # over every workspace target with warnings denied, then every workspace test - so a warning
      # that only surfaces under the grep-only cfg (dead code behind a default feature, an unused
      # import in a fallback path) fails CI instead of silently rotting.
      - name: no-default lane (grep-only, --no-default-features)
        run: sh .rigger/gates/lanes.sh no-default
      # Spec 93 criterion 6, the terminal gate: the pure `core` lane (`--no-default-features
      # --features core`) gets the battery too, for every workspace member that declares a `core`
      # feature - derived by the lanes script from `cargo metadata`, never listed - so a lint or a
      # regression that only surfaces under the `core` cfg universe fails CI instead of rotting.
      # A member that ships a binary (the root package) is linted on its library alone: THE
      # FEATURE SPLIT (spec 93 Design) gates the binary, and the tests that drive it, behind
      # `store`. A test step whose every test binary runs zero tests fails the lane. The
      # wasm32-unknown-unknown cross-compile of the pure subset stays the deliberately opt-in
      # expensive check tests/core_lane_purity_audit.rs gates behind `RIGGER_CORE_LANE_VERIFY=1`;
      # this lane proves the native side of the same lane on every run instead.
      - name: core lane (--no-default-features --features core)
        run: sh .rigger/gates/lanes.sh core

  # Regression guard for dependency skew on a FRESH resolve. `cargo install` without
  # `--locked` ignores the committed Cargo.lock and re-resolves every dependency to the
  # newest version its constraints allow. That is how an end user installs (the README's
  # `cargo install --git ...` carries no `--locked`), and it is exactly where a transitive
  # crate can skew FORWARD past the version a pinned direct dependency was built against
  # (under semver a pre-release requirement such as `2.0.0-rc.9` also matches every later rc
  # of 2.0.0). This job proves the fresh resolve stays coherent by actually running the
  # no-`--locked` install into a throwaway --root and executing the resulting binary, so a
  # forward skew fails CI here instead of only biting a user who runs `cargo install`.
  install-nolock:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Spec 93 criterion 3: this job's `cargo install` uses the default features
          # (dash.rs included), so build.rs's nested wasm32-unknown-unknown cross-compile
          # of crates/console-core runs here too.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # No `--locked`: force a fresh resolution so a forward-skewed transitive dep is
      # caught. `--root "$RUNNER_TEMP/rigger-install"` keeps the install out of the way.
      - name: cargo install --path . WITHOUT --locked (fresh resolve)
        run: cargo install --path . --force --root "$RUNNER_TEMP/rigger-install"
      # Execute the freshly-installed binary: a clean resolve that produces a broken
      # binary is still a failure, so prove it runs (prints usage, exits without a crash).
      - name: run the installed binary
        run: "$RUNNER_TEMP/rigger-install/bin/rigger --help"

  # The KurrentDB EventStore adapter is compiled into every build now (spec 47: its
  # build-time feature flag is retired), so this job carries no `--features kurrentdb`.
  # The adapter and its tests live in crates/rigger-store-sqlite. The build-test lanes'
  # `cargo test --workspace` runs them too; this job lints and tests that crate alone, on
  # its lightest features: the adapter's unit tests and its contract test, which spins up a real
  # KurrentDB via testcontainers (the runner's Docker, found at its default socket) and
  # runs the same suite the SQLite store passes (proxy fidelity).
  kurrentdb:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # One crate on its lightest features: nothing here builds the root package or its wasm32
      # cross-compile.
      - name: clippy
        run: cargo clippy -p rigger-store-sqlite --no-default-features --lib --tests -- -D warnings
      # The contract runs under the test runner's default address-space cap
      # (.cargo/pidns-runner.sh), like every other test: the store's runtime runs one worker,
      # so the adapter's threads fit under it.
      - name: contract test (KurrentDB via testcontainers)
        run: cargo test -p rigger-store-sqlite --no-default-features eventstore::kurrentdb

  # The cross-OS check (spec 125): the workspace compiles on Windows and on macOS, one leg per OS.
  # No job runs a test there: this check is the compile of the macOS and Windows adapters. The check
  # step runs under bash on every runner and exports an empty RUSTC_WRAPPER in its own shell, so
  # cargo and any cargo it starts run no wrapper: .cargo/config.toml names a Unix shell script as
  # its wrapper, and an empty environment value overrides it. The build script's version
  # derivation degrades to `+unversioned` without go-gitsemver, so the job installs nothing else.
  cross-os-check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, as build-test checks out: the build script's provenance (`git describe`)
          # names the nearest reachable tag, which a shallow checkout lacks.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Spec 93 criterion 3: `cargo check` runs crates/rigger-dash's build script, which
          # cross-compiles crates/console-core for this target.
          targets: wasm32-unknown-unknown
      - name: check the workspace
        shell: bash
        run: |
          export RUSTC_WRAPPER=
          cargo check --workspace
